# Production wave subgraph. Two data sources:
#   (a) EnsStrategyRouter  -> StrategyDeployed, Swapped
#   (c) Aqua               -> Pushed, Pulled, Docked (committed capital + status)
# (The ENS resolver source, and the Follow/Follower/NodeFollows entities it fed, are REMOVED —
# follows were ENS text records and the ENS layer is gone. World AgentKit owns identity; it
# verifies humans but stores no follow edges. Capital IS the social signal now.)
# Reorg safety comes from graph-node's NATIVE block-level revert (entity versions for a
# reverted block are undone, then the block is re-indexed) — NOT from any id-overwrite trick.
# Mutable entities (Strategy) are re-applied by the re-index, so their aggregates
# (cumulativeVolume*, lastSwapTimestamp) stay correct across reorgs.
# SPDX-License-Identifier: UNLICENSED
#
# ⚠️ CONTRACT-LAYER ASSUMPTION (D1 — loud, NOT enforced on-chain): the three handlers key the
# SAME Strategy row only if
#     Strategy.id == StrategyDeployed.strategyId == Swapped.orderHash == SwapVM.hash(order).
# `announceStrategy(bytes32 strategyId, bytes32)` takes a FREE-FORM strategyId and `Swapped`
# emits `orderHash = SwapVM.hash(order)`; nothing on-chain binds them. Only `handleStrategyDeployed`
# creates Strategy rows (F2), so a mismatch shows up as swaps DROPPED, not phantom rows —
# but the demo still breaks if the announcer passes the wrong id. (The second bytes32 arg was
# born the ENS namehash; the agent now passes the strategyId itself — opaque to the router.)

enum StrategyStatus {
  active
  stopped
  removed
}

type Strategy @entity {
  # id == StrategyDeployed.strategyId == Swapped.orderHash == SwapVM.hash(order).
  id: Bytes!
  programHash: Bytes! # bytes32(0) tolerated until the compiler lands (D3: UI hash-verify chip
                       # must gate on programHash != 0; see SUBGRAPH-CONTRACT-GAPS.md C3)
  status: StrategyStatus! # "active" on deploy; "stopped"/"removed" if the router emits them

  # Ranking aggregates (Pietro.md 🔢 — the UI computes rank from these raw values):
  #   rank = returnPct × recencyDecay
  #   returnPct = (realized + unrealized PnL) ÷ committedCapital
  # (Historical: the third term, the (1 + log2(1 + followers)) follower nudge, is gone with
  # the ENS follow layer.)
  # Volumes are BigInt, NOT BigDecimal: graph-node's BigDecimal is decimal128 (capped at 34 sig
  # figs), so every .plus() normalizes and drops low-order wei once cumulative > ~10^34. BigInt
  # has no such cap. The UI converts to BigDecimal at read time only when it needs a ratio.
  cumulativeVolumeIn: BigInt! # sum of Swap.amountIn   (returnPct numerator proxy)
  cumulativeVolumeOut: BigInt! # sum of Swap.amountOut  (returnPct numerator proxy)
  # committedCapital = returnPct's DENOMINATOR. Sourced from Aqua itself (the authoritative
  # 1inch balance-management protocol), NOT a number we declare: Aqua emits Pushed(amount) on
  # every ship/push and Pulled(amount) on every withdrawal, keyed by strategyHash == Strategy.id
  # (verified equal: test/helpers/AquaSwapVMHelper.sol:357 asserts strategyHash == orderHash).
  # Maintained as a running balance: handlePushed adds, handlePulled subtracts — so it stays
  # correct as capital enters and leaves. This resolved the C2 gap (no contract change needed).
  committedCapital: BigInt! # running maker-committed notional (Aqua Pushed − Pulled)
  # L1 (listing threshold — CONSUMER-LAYER rule, not a field): a strategy RANKS once it has
  # `swapCount >= 3` AND `now - lastSwapTimestamp >= 3600` (seconds); before that it is listed but
  # unranked. graph-node has no derived/computed boolean that stays in sync without a block handler,
  # so this is applied identically by the UI getFeed() and the agent feed query. See README.
  swapCount: Int!
  lastSwapTimestamp: BigInt! # recencyDecay = 0.5^(hoursSinceLastSwap/24); 0 if never swapped

  swaps: [Swap!]! @derivedFrom(field: "strategy") # graph-node pluralizes -> query field "swaps"
}

type Swap @entity(immutable: true) {
  # 36-byte composite id (txHash[32] || uint32 logIndex) — a unique key only, NOT a bytes32
  # hash. Reorg safety is graph-node's block-level revert, not this id. Never join on it; the
  # strategy join is on `strategy` (bytes32) below.
  id: Bytes!
  strategy: Strategy! # == Swapped.orderHash; consumer filters swaps(where:{strategy:$id})
  maker: Bytes!
  taker: Bytes!
  tokenIn: Bytes!
  tokenOut: Bytes!
  amountIn: BigInt!
  amountOut: BigInt!
  timestamp: BigInt! # == blockTimestamp; consumer orderBy:timestamp
  blockNumber: BigInt!
  transactionHash: Bytes!
}
