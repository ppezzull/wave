# wave — Dokploy deployment compose (ui + agent only).
#
# Trimmed from the hackathon scaffold: swap-vm (Foundry, run-once), compiler,
# and subgraph (needs ipfs+postgres) are NOT web-facing — excluded here, remain
# in git history. Two public sites:
#   - ui     → wave.craftale.it    (Next.js, container port 3000 → host 3005)
#   - agent  → mastra.craftale.it  (Mastra HTTP server, container port 3002 → host 4001)
#
# DELIVERY: craftale.it is fronted by Cloudflare and delivered via a cloudflared
# TUNNEL → the service's published HOST port (VPS :80 is Apache, not Traefik).
# Tunnel ingress (on the VPS cloudflared config, same as craftlead.craftale.it):
#   wave.craftale.it   → http://localhost:3005
#   mastra.craftale.it → http://localhost:4001
#
# HOST PORT: mastra publishes 4001, NOT 4000 (host 4000 = litellm-proxy).
#
# Secrets: every ${VAR} is injected by Dokploy's compose env (encrypted at rest).
# The original `env_file: ../.env` is dropped (`.env` is gitignored → absent in clone).
services:
  ui:
    build:
      context: ./requirements/ui
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be present at `next build` time (inlined into client bundle).
        - NEXT_PUBLIC_PRIVY_APP_ID=${NEXT_PUBLIC_PRIVY_APP_ID:-}
    restart: unless-stopped
    ports:
      - "3005:3000"
    networks:
      - dokploy-network
    environment:
      - NODE_ENV=production
      - AGENT_URL=http://agent:3002
      - COMPILER_URL=${COMPILER_URL:-http://compiler:3001}
      # Server-side feature flags (no NEXT_PUBLIC_ prefix → server-only at runtime).
      - WAVE_USE_MOCK=${WAVE_USE_MOCK:-false}
      - WAVE_ENS_WIRED=${WAVE_ENS_WIRED:-true}
      - ENS_NODE=${ENS_NODE:-}
      # Also exposed at runtime for server components / route handlers.
      - NEXT_PUBLIC_PRIVY_APP_ID=${NEXT_PUBLIC_PRIVY_APP_ID:-}

  agent:
    build:
      context: ./requirements/agent
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4001:3002"
    networks:
      - dokploy-network
    environment:
      # LLM (craftshost OpenAI-compat gateway, Langfuse-traced)
      - ZAI_BASE_URL=${ZAI_BASE_URL}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - ZAI_PUBLIC_KEY=${ZAI_PUBLIC_KEY}
      - ZAI_MODEL=${ZAI_MODEL}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-90000}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      # Storage + HTTP port
      - LIBSQL_URL=${LIBSQL_URL:-:memory:}
      - EVIDENCE_PATH=${EVIDENCE_PATH:-./evidence.jsonl}
      - PORT=3002
      # Sepolia settlement
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - SEPOLIA_PRIVATE_KEY=${SEPOLIA_PRIVATE_KEY}
      - MAKER_PRIVATE_KEY=${MAKER_PRIVATE_KEY}
      - TAKER_PRIVATE_KEY=${TAKER_PRIVATE_KEY}
      - PS_NETWORK=${PS_NETWORK:-sepolia}
      - OPS_CHAIN_ID=${OPS_CHAIN_ID:-11155111}
      - OPS_SWAP_VM_ROUTER_NAME=${OPS_SWAP_VM_ROUTER_NAME:-Wave}
      - OPS_SWAP_VM_ROUTER_VERSION=${OPS_SWAP_VM_ROUTER_VERSION:-1}
      - OPS_AQUA_ADDRESS=${OPS_AQUA_ADDRESS}
      - OPS_WETH_ADDRESS=${OPS_WETH_ADDRESS:-}
      - AQUA_ADDRESS=${AQUA_ADDRESS}
      - ROUTER_ADDRESS=${ROUTER_ADDRESS}
      - ENS_STRATEGY_ROUTER=${ROUTER_ADDRESS}
      - ENS_PARENT_NAME=${ENS_PARENT_NAME:-wave.eth}
      - ENS_REGISTRY=${ENS_REGISTRY:-}
      - WAVE_SUBGRAPH_URL=${WAVE_SUBGRAPH_URL}
      - MONITOR_SOURCE=${MONITOR_SOURCE:-subgraph}
      - AGENT_ENDPOINT_MCP=http://agent:3002

networks:
  dokploy-network:
    external: true
