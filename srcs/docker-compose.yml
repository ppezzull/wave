# wave — Dokploy deployment compose (ui + agent only).
#
# Trimmed from the hackathon scaffold: swap-vm (Foundry, run-once build/deploy
# harness, restart: "no"), compiler, and subgraph (needs ipfs+postgres infra
# that is still placeholder) are NOT web-facing and are excluded here — they
# remain in git history for local dev. This file deploys the two public sites:
#   - ui     → wave.craftale.it   (Next.js, container port 3000)
#   - agent  → mastra.craftale.it (Mastra HTTP server, container port 3002)
#
# WHY NO host `ports:` — Dokploy's Traefik routes over the shared Docker
# network, so the containers don't publish host ports. This sidesteps the
# host-port-4000 collision with litellm-proxy on the Nebula host.
#
# Secrets: every ${VAR} is injected by Dokploy's compose environment
# (encrypted at rest in Dokploy) — none are committed to this repo. The
# original `env_file: ../.env` is dropped because `.env` is gitignored and
# therefore absent in Dokploy's clone.
services:
  ui:
    build:
      context: ./requirements/ui
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    environment:
      - NODE_ENV=production
      # Server-side: the Next.js server reaches the agent over the shared network.
      - AGENT_URL=http://agent:3002
      - COMPILER_URL=${COMPILER_URL:-}

  agent:
    build:
      context: ./requirements/agent
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    environment:
      # LLM (craftshost OpenAI-compat gateway, Langfuse-traced)
      - ZAI_BASE_URL=${ZAI_BASE_URL}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - ZAI_PUBLIC_KEY=${ZAI_PUBLIC_KEY}
      - ZAI_MODEL=${ZAI_MODEL}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-90000}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      # Storage + HTTP port (Dockerfile also sets PORT=3002; repeated for clarity)
      - LIBSQL_URL=${LIBSQL_URL:-:memory:}
      - PORT=3002
      # Sepolia settlement
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - SEPOLIA_PRIVATE_KEY=${SEPOLIA_PRIVATE_KEY}
      - MAKER_PRIVATE_KEY=${MAKER_PRIVATE_KEY}
      - TAKER_PRIVATE_KEY=${TAKER_PRIVATE_KEY}
      - PS_NETWORK=${PS_NETWORK:-sepolia}
      - OPS_CHAIN_ID=${OPS_CHAIN_ID:-11155111}
      - OPS_SWAP_VM_ROUTER_NAME=${OPS_SWAP_VM_ROUTER_NAME:-Wave}
      - OPS_SWAP_VM_ROUTER_VERSION=${OPS_SWAP_VM_ROUTER_VERSION:-1}
      - OPS_AQUA_ADDRESS=${OPS_AQUA_ADDRESS}
      - AQUA_ADDRESS=${AQUA_ADDRESS}
      - ROUTER_ADDRESS=${ROUTER_ADDRESS}
      - ENS_STRATEGY_ROUTER=${ROUTER_ADDRESS}
      - WAVE_SUBGRAPH_URL=${WAVE_SUBGRAPH_URL}
      - AGENT_ENDPOINT_MCP=http://agent:3002

networks:
  dokploy-network:
    external: true
